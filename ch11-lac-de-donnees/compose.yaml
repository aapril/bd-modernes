# Chapitre 11 : MinIO (image de Chainguard)
services:
  minio:
    image: cgr.dev/chainguard/minio:latest
    container_name: minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
      - ../ch03-acces-programme/donnees:/donnees:ro
volumes:
  miniodata:
